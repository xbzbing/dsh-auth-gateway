# dsh-auth-gateway bundle patch.
#
# Mounted as a bundle layer (package.json "dsh.bundle"), applied after
# dsh-base / dsh-web-app. Two effects:
#
#   1. Move the real webserver to a loopback-only internal port. This is the
#      security-critical half of the design: with host 127.0.0.1 the internal
#      port is unreachable from other machines, so the login gateway (which
#      owns the external port) is the only way in.
#   2. Insert the login gateway plugin itself.
#
# Ports follow `dsh web --port <N>` (the web-startup service, the same
# mechanism the web-app bundle uses): the gateway serves the URL port N
# (default 3080) and the internal webserver sits at N+1 (default 3081).
# `--host 0.0.0.0` is refused by dsh itself; the gateway's listenHost
# (default 0.0.0.0) is what exposes the service. Do not use `--port 0`
# (OS-assigned) — the gateway needs a fixed internal port to forward to.

- id: webserver
  config:
    host: 127.0.0.1
    port: !!js (ctx.webStartup.port ?? 3080) + 1
    # Whole-config replacement: the web-app bundle's compression defaults
    # (gzip / level 1 / ≥1024 bytes) must be restated here too, or the row
    # falls back to the schema defaults ('none') and the internal server
    # stops compressing responses.
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# web-app's own URL line prints the INTERNAL webserver address
# (http://127.0.0.1:<internal port>), which is loopback-only by design and
# would mislead; the login gateway prints the real URL instead. The whole
# config is restated because a patch replaces it:
#
#   surfaceContext   stays on;
#   openBrowser      must keep flowing from the CLI flags — the web-app schema
#                    default is TRUE, so omitting it makes `dsh web --no-open`
#                    ineffective and pops a browser tab on every boot;
#   publicUrl        must keep flowing too, or an operator's `--public-url` is
#                    silently dropped. It is display-only (dsh's own help says
#                    it "grants no trust") and feeds the printed/opened URL,
#                    DSH_WEB_URL, and — since 0.2.1-alpha.3 — the runtime
#                    context line `Current DeepSeek Harness Web GUI URL`.
#                    Dropping it makes those surfaces name the internal
#                    loopback origin, and the browser handoff then opens the
#                    INTERNAL port with the launch token, minting a dsh session
#                    that never passes the gateway password;
#   trustedHosts     is a web-app config field only on dsh <= 0.1.7-rc.2
#                    (commit cb9a590c86 moved it to the `connection` row, which
#                    this patch does not touch). Kept so `--trusted-host` still
#                    reaches web-app at the older end of the supported range;
#                    ignored on newer dsh. Do not "clean it up".
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    openBrowser: !!js ctx.webStartup.openBrowser
    publicUrl: !!js ctx.webStartup.publicUrl
    trustedHosts: !!js ctx.webStartup.trustedHosts

- insert:
    - id: dsh-auth-gateway
      name: dsh-auth-gateway
      inject: [webStartup]
      config:
        listenHost: 0.0.0.0
        listenPort: !!js ctx.webStartup.port ?? 3080
        upstreamHost: 127.0.0.1
        upstreamPort: !!js (ctx.webStartup.port ?? 3080) + 1
