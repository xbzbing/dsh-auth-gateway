# Patch overlay for `scripts/screenshots.mjs` — enables the OTP flow so the
# onboarding QR page and the 2FA login are reachable while capturing the README
# screenshots.
#
# Usage (a throwaway instance, so the capture never touches your real data):
#   DSH_HOME=/tmp/shots-home dsh --profile shots --patch scripts/screenshots.patch.yml --port 8002
#
# `config:` is a WHOLE-OBJECT replacement: every field the plugin's bundle
# patch declared must be restated here — including the dynamic `!!js` port
# expressions. Omitting them does not merge; it silently falls back to the
# schema defaults and the gateway ends up listening on the wrong port,
# forwarding to the wrong upstream, i.e. a broken instance that still boots.
- id: dsh-auth-gateway
  config:
    listenHost: 0.0.0.0
    listenPort: !!js ctx.webStartup.port ?? 3080
    upstreamHost: 127.0.0.1
    upstreamPort: !!js (ctx.webStartup.port ?? 3080) + 1
    # OTP routes (/otp/setup, the onboarding QR step, the 2FA login) are only
    # reachable when OTP is enabled in the composition.
    otpEnabled: true
    # Whole-object replacement again: the web-app schema default for
    # openBrowser is TRUE, so omitting it makes --no-open ineffective and pops
    # a browser tab pointing at the internal port while capturing.
    openBrowser: !!js ctx.webStartup.openBrowser
    # Screenshots are captured offline-friendly: no update check on panel open.
    # (The panel's own button still works, but nothing is captured from it.)
    updateCheck: false
